name: 编译项目

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        # Temurin has no JDK 17 build for Windows on ARM64, so that runner uses Microsoft's JDK 17 instead
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        architecture: ${{ matrix.arch }}
    - name: 缓存 Maven 依赖
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 编译项目
      run: ./mvnw clean compile

#    - name: 运行测试
#      run: ./mvnw test
    - name: 打包项目
      run: ./mvnw package -DskipTests
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
